<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walboard</title>
    <!-- Tab icon: SVG for modern browsers, PNG for Safari and home screens -->
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="Canvases"></aside>

    <!-- Drawing area: everything inside is positioned relative to it -->
    <main id="stage" class="stage">
      <canvas id="board"></canvas>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Tools"></div>
      <div class="file-bar">
        <button id="toggle-sidebar" class="tool-btn" title="Show or hide the canvases panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" />
          </svg>
        </button>
        <div class="tool-separator"></div>
        <button id="open-file" class="tool-btn" title="Open (as a new canvas)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
        </button>
        <button id="save-file" class="tool-btn" title="Save to a file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7V4M8 20v-6h8v6" />
          </svg>
        </button>
        <button id="export-png" class="tool-btn" title="Export as PNG (the selection, or everything if nothing is selected)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3M7 8l5-5 5 5" /><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
          </svg>
        </button>
      </div>
      <div id="style-panel" class="style-panel" hidden></div>
      <div class="bottom-bar">
        <button id="zoom-out" class="tool-btn" title="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12" /></svg>
        </button>
        <button id="zoom-reset" class="zoom-label" title="Reset zoom">100%</button>
        <button id="zoom-in" class="tool-btn" title="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12" /></svg>
        </button>
        <div class="tool-separator"></div>
        <button id="undo" class="tool-btn" title="Undo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5" /><path d="M4 9h11a5 5 0 0 1 0 10h-3" />
          </svg>
        </button>
        <button id="redo" class="tool-btn" title="Redo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14l5-5-5-5" /><path d="M20 9H9a5 5 0 0 0 0 10h3" />
          </svg>
        </button>
      </div>
      <button id="delete-selection" class="floating-btn" title="Delete" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </svg>
      </button>
    </main>

    <!-- Classic scripts (no modules) so it works when opening the file directly -->
    <script src="js/elements.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/sketch.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/history.js"></script>
    <script src="js/files.js"></script>
    <script src="js/canvases.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/stylePanel.js"></script>
    <script src="js/textEditor.js"></script>
    <script src="js/toolbar.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
